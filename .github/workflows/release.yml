name: Release

on:
  push:
    branches: [master, test]
    # Defensive: branch filtering already excludes tag pushes, but keep the
    # release tag family explicit here.
    tags-ignore: ['2.1.88-v*']

concurrency:
  # Serialise releases across pushes. Newer pushes wait for the in-flight
  # release to finish — cancel-in-progress: false because we never want to
  # abandon a partially-shipping release.
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.compute.outputs.version }}
      prerelease: ${{ steps.compute.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: compute
        shell: bash
        run: |
          set -euo pipefail
          base="$(node -p "require('./package.json').version")"
          base_regex="${base//./\\.}"
          BRANCH="${GITHUB_REF#refs/heads/}"

          # Continue from the old v0.0.N release count during migration, then
          # use only the new 2.1.88-vN tag family.
          stable_build=0
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^${base_regex}-v([1-9][0-9]*)$ ]]; then
              candidate="${BASH_REMATCH[1]}"
              if (( candidate > stable_build )); then stable_build="$candidate"; fi
            fi
          done < <(git tag --list "${base}-v*")
          if (( stable_build == 0 )); then
            while IFS= read -r tag; do
              if [[ "$tag" =~ ^v0\.0\.([1-9][0-9]*)$ ]]; then
                candidate="${BASH_REMATCH[1]}"
                if (( candidate > stable_build )); then stable_build="$candidate"; fi
              fi
            done < <(git tag --list 'v0.0.*')
          fi

          next_build=$((stable_build + 1))
          if [ "$BRANCH" = "test" ]; then
            test_build=0
            while IFS= read -r tag; do
              if [[ "$tag" =~ ^${base_regex}-v${next_build}-test\.([1-9][0-9]*)$ ]]; then
                candidate="${BASH_REMATCH[1]}"
                if (( candidate > test_build )); then test_build="$candidate"; fi
              fi
            done < <(git tag --list "${base}-v${next_build}-test.*")
            next="${base}-v${next_build}-test.$((test_build + 1))"
            prerelease="true"
          else
            next="${base}-v${next_build}"
            prerelease="false"
          fi

          if git rev-parse --verify "refs/tags/${next}" >/dev/null 2>&1; then
            echo "error: tag ${next} already exists. Refusing to reuse it."
            exit 1
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Branch=$BRANCH -> $next (prerelease=$prerelease)"

  validate:
    name: Test and validate
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build bundle with release version
        env:
          CC_BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: bun run build

  build:
    name: Build ${{ matrix.target }}
    needs: [version, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            outfile: dist/bin/cc-linux-x64
          - target: bun-linux-arm64
            outfile: dist/bin/cc-linux-arm64
          - target: bun-linux-x64-musl
            outfile: dist/bin/cc-linux-x64-musl
          - target: bun-linux-arm64-musl
            outfile: dist/bin/cc-linux-arm64-musl
          - target: bun-darwin-x64
            outfile: dist/bin/cc-darwin-x64
          - target: bun-darwin-arm64
            outfile: dist/bin/cc-darwin-arm64
          - target: bun-windows-x64
            outfile: dist/bin/cc-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
        with:
          # Build job only needs the working tree, not history. The version
          # job above is the one that needs fetch-depth: 0 for tag reads.
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone (${{ matrix.target }})
        env:
          BUN_COMPILE_TARGET: ${{ matrix.target }}
          BUN_COMPILE_OUTFILE: ${{ matrix.outfile }}
          CC_BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: bun run build:compile

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cc-${{ needs.version.outputs.version }}-${{ matrix.target }}
          path: ${{ matrix.outfile }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Defensive: refuse to publish on non-push events. The trigger is already
    # `on.push:` only, but if anyone later adds `pull_request` to `on:`, this
    # guard prevents creating a release on every PR.
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist/bin
          merge-multiple: true

      # Gate the release on all expected outfiles being present. Without
      # this, a partial-failure matrix would still
      # ship a release tagged as the full version with one binary missing.
      # The list MUST match the build matrix `outfile` values above; if you
      # add a matrix entry, add it here too.
      - name: Verify all binaries are present
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "dist/bin/cc-linux-x64"
            "dist/bin/cc-linux-arm64"
            "dist/bin/cc-linux-x64-musl"
            "dist/bin/cc-linux-arm64-musl"
            "dist/bin/cc-darwin-x64"
            "dist/bin/cc-darwin-arm64"
            "dist/bin/cc-windows-x64.exe"
          )
          missing=()
          for f in "${expected[@]}"; do
            if [ ! -f "$f" ]; then
              missing+=("$f")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "error: ${#missing[@]} binary/binarie(s) missing from the download:"
            for m in "${missing[@]}"; do
              echo "  - $m"
            done
            echo "refusing to publish a partial release. Check the build matrix for failures."
            exit 1
          fi
          echo "all ${#expected[@]} binaries present."

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/bin/cc-linux-x64
            dist/bin/cc-linux-arm64
            dist/bin/cc-linux-x64-musl
            dist/bin/cc-linux-arm64-musl
            dist/bin/cc-darwin-x64
            dist/bin/cc-darwin-arm64
            dist/bin/cc-windows-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
